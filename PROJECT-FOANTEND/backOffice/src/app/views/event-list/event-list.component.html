<div class="container">
  <h1 class="header">Upcoming Events</h1>
  <div class="event-grid">
    <mat-card *ngFor="let event of events" class="event-card">
      <mat-card-header>
        <div mat-card-avatar class="event-avatar"></div>
        <mat-card-title>{{ event.eventTitle }}</mat-card-title>
        <mat-card-subtitle>Type: {{ event.eventType }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p><strong>Location:</strong> {{ event.location }}</p>
        <p><strong>Date:</strong> {{ event.eventDate | date: 'mediumDate' }}</p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-raised-button color="primary">View</button>
        <button mat-stroked-button color="accent">Register</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
