<mat-card class="p-0" [@animate]="{value:'*',params:{y:'50px',delay:'300ms'}}">
  <mat-card-content class="p-0" style="display:flex;flex-direction: row;justify-content:  space-between !important;">
    
    <!-- Amount Input Field with spacing -->
    <mat-form-field appearance="fill" class="form-field-spacing">
      <mat-label>Amount</mat-label>
      <input matInput type="number" [(ngModel)]="amount" placeholder="Enter amount">
    </mat-form-field>

    <!-- Margin Input Field with spacing -->
    <mat-form-field appearance="fill" class="form-field-spacing">
      <mat-label>Margin</mat-label>
      <input matInput type="number" [(ngModel)]="margin" min="0" max="1" step="0.01" placeholder="Enter margin">
    </mat-form-field>

    <!-- Strategy Select Field with spacing -->
    <mat-form-field appearance="fill" class="form-field-spacing">
      <mat-label>Select Strategy</mat-label>
      <mat-select [(ngModel)]="strategy">
        <mat-option value="1">Strategy 1</mat-option>
        <mat-option value="2">Strategy 2</mat-option>
        <mat-option value="3">Strategy 3</mat-option>
      </mat-select>
    </mat-form-field>

  </mat-card-content>
  <div style="display: flex; justify-content: center; margin-top: 1rem;">
    <button mat-raised-button color="primary" style="width: 20rem;margin-bottom: 1em;" (click)="onStrategyChange()">Check Strategy</button>
  </div>

  <!-- Display Strategy Stats if Available -->
  <div *ngIf="strategyStats">
    <h4>Strategy Stats:</h4>
    <table mat-table [dataSource]="strategyStats | keyvalue">
      <!-- Key Column -->
      <ng-container matColumnDef="key">
        <th mat-header-cell *matHeaderCellDef> name </th>
        <td mat-cell *matCellDef="let element"> {{element.key}} </td>
      </ng-container>

      <!-- Value Column -->
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef> Value </th>
        <td mat-cell *matCellDef="let element"> {{element.value}} </td>
      </ng-container>

      <!-- Table Header and Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    </div>
  <!-- Check Strategy Button, centered and with spacing -->
 

</mat-card>
